name: spectral-task
arch: amd64
platform: linux
version: ${PACKAGE_VERSION}
version_schema: none
section: utils
priority: optional
maintainer: un1or <un1or@ya.ru>
description: Бинарные компоненты стенда Spectral low-latency transport
vendor: spectral-task
homepage: https://github.com/Un1oR/spectral-challenge

depends:
  - libc6 (>= 2.39)
  - libgcc-s1
  - libstdc++6
  - dpdk
  - librte-eal24
  - librte-ethdev24
  - librte-mbuf24
  - librte-mempool24
  - librte-mempool-ring24
  - librte-net24
  - librte-net-ena24

contents:
  - src: package/usr/libexec/spectral-task
    dst: /usr/libexec/spectral-task
    type: tree
  - src: package/usr/share/doc/spectral-task
    dst: /usr/share/doc/spectral-task
    type: tree
